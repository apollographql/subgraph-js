name: Federation Compatibility

on:
  workflow_call:

jobs:
  compatibility:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install compatibility dependencies
        run: npm ci
        working-directory: compatibility

      - name: Run compatibility suite
        run: npm run compatibility
        working-directory: compatibility

      - name: Archive compatibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-results
          path: compatibility/results.md
          retention-days: 7
          if-no-files-found: ignore
